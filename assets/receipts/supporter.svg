<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="ETH Cali donation receipt, Supporter tier">
  <defs>
    <radialGradient id="halo" cx="50%" cy="44%" r="58%">
      <stop offset="0" stop-color="#2B23EF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2B23EF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="#06060B"/>
  <rect width="1000" height="1000" fill="url(#halo)"/>

  <!-- Double diamond: the octahedron as filigree ironwork. One colour, no glow. -->
  <g fill="none" stroke="#2B23EF" stroke-linejoin="round" stroke-linecap="round">
    <path d="M500 150 L742 500 L500 850 L258 500 Z" stroke-width="7"/>
    <path d="M500 296 L642 500 L500 704 L358 500 Z" stroke-width="4" opacity="0.72"/>
    <g stroke-width="2.5" opacity="0.4">
      <path d="M500 150 L500 296"/>
      <path d="M742 500 L642 500"/>
      <path d="M500 850 L500 704"/>
      <path d="M258 500 L358 500"/>
    </g>
  </g>

  <text x="500" y="120" fill="#9A9DAE" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="26" letter-spacing="4.2" text-anchor="middle">ETH CALI</text>

  <text x="500" y="932" fill="#F2F3F7" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="62" font-weight="700" letter-spacing="-1.2" text-anchor="middle">Supporter</text>

  <text x="500" y="972" fill="#5F6377" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" letter-spacing="3" text-anchor="middle">DONATION RECEIPT</text>
</svg>
